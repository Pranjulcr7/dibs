build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    excludes: ['**/src/test/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    # Validation-heavy domain functions use guard clauses returning typed failures.
    max: 6
