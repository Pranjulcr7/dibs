name: Bug report
description: Something is broken or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open group …
        2. Add expense …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dibs version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 15
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots welcome. Never post your backup file or sync codes.
